org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError "-Djava.io.tmpdir=D:/Android/program/OH CARDS/.gradle-tmp"
android.useAndroidX=true
